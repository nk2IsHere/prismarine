# The settings of the lints for this repository, read by src/config.dart.
# Paths are relative to the repository root.
code_roots: [packages/, apps/, tools/]
loose_dirs: [tools/lint]
comment_check_exempt: [tools/lint/]
baselines:
  code_shape: tools/lint/baseline.json
  analyze: tools/lint/analyze_baseline.json
  alloc: tools/lint/alloc_baseline.json
alloc:
  roots: tools/lint/alloc_roots.txt
  sdk: tools/lint/alloc_sdk.txt
privacy:
  private_env: PRISMARINE_PRIVATE
  pending: tools/lint/privacy_pending.txt
links: [CLAUDE.md, README.md, docs/memory, docs/areas]
# The repository has no doc folders with one file per entry.
docs_index: []
code_shape:
  history:
    names: []
    pointers: []
  # Only the generic rules for size, history, long comments and functions.
  rule_sets: {}
