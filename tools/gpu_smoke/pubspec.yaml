name: gpu_smoke
description: "Flutter GPU smoke test for a (patched) engine: renders through the screen copy of prismarine_scene, reads the pixels back, times draws and binds, exits."
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  prismarine_cook:
    path: ../../packages/prismarine_cook
  prismarine_scene:
    path: ../../packages/prismarine_scene
  vector_math: ^2.1.4
  hooks: ^2.0.0
dependency_overrides:
  # The vendored Dart side (third_party/flutter_gpu/PATCHES.md): uses the
  # patched engine's slot binds when present, the stock calls otherwise.
  flutter_gpu:
    path: ../../third_party/flutter_gpu
flutter:
  uses-material-design: false
  # The smoke test's shader bundle (hook/build.dart).
  assets:
    - build/shaderbundles/
    # The shaders of the release 9 checks, cooked from prismarine.yaml.
    - features_generated/
