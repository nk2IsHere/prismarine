name: prismarine_sample
description: The sample of prismarine. Intel's Sponza with a fly camera, moving coloured lights, gamepads and the debug panel, drawn by prismarine_pbr. It is also the smoke test and a performance scene.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  hooks: ^2.0.0
  image: ^4.5.0
  prismarine_assets:
    path: ../../packages/prismarine_assets
  prismarine_cook:
    path: ../../packages/prismarine_cook
  prismarine_debug:
    path: ../../packages/prismarine_debug
  prismarine_loop:
    path: ../../packages/prismarine_loop
  prismarine_math:
    path: ../../packages/prismarine_math
  prismarine_pad:
    path: ../../packages/prismarine_pad
  prismarine_pbr:
    path: ../../packages/prismarine_pbr
  prismarine_render:
    path: ../../packages/prismarine_render
  prismarine_scene:
    path: ../../packages/prismarine_scene
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  # Flutter GPU with the patches of the engine fork.
  flutter_gpu:
    path: ../../third_party/flutter_gpu

flutter:
  uses-material-design: true
  # The shaders of prismarine_pbr, cooked by hook/build.dart from prismarine.yaml.
  assets:
    - shaders_generated/records.json
    - path: shaders_generated/bundle/metal/
      platforms:
        - macos
    - path: shaders_generated/bundle/vulkan/
      platforms:
        - linux
        - windows
