[package]
name = "mcsm_luac"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compiles Lua source with stock Lua 5.2.3 configured like GameApp.exe (vendored C, built by build.rs) and hands back the dumped chunk"

[lib]
name = "mcsm_luac"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The portable pow behind luai_numpow (luaconf.h), the version the mixer pins.
libm = "=0.2.16"

[build-dependencies]
cc = "1"

[profile.release]
# No strip pass, here and for host-side proc-macros (rlsf's rustversion):
# Xcode 27's strip leaves dylibs dyld refuses ("mis-aligned LINKEDIT string
# pool"). In the manifest, so no build environment can lose it.
strip = "none"
opt-level = 3
codegen-units = 1
debug = false

[profile.release.build-override]
strip = "none"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
