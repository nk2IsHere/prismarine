[package]
name = "prismarine_luac64"
version = "0.1.0"
edition = "2021"
publish = false
build = "../build.rs"
description = "Compiles Lua source with stock Lua 5.2.3 built with double numbers, the float64 mode of prismarine_lua, and returns the dumped chunk"

[lib]
name = "prismarine_luac64"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The portable pow behind luai_numpow of luaconf.h.
libm = "=0.2.16"

[build-dependencies]
cc = "1"

[profile.release]
# No strip pass, here and for host-side proc-macros: the strip of Xcode 27
# leaves dylibs that dyld refuses ("mis-aligned LINKEDIT string pool").
strip = "none"
opt-level = 3
codegen-units = 1
debug = false

[profile.release.build-override]
strip = "none"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(lua_float32)"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
