name: prismarine_cook
description: The cook of a prismarine app. Reads its prismarine.yaml, finds the patched engine of its release, cooks its shaders and runs its asset steps when the hash of their inputs changed, and cooks the shaders in the build hook of the app.
publish_to: none
environment:
  sdk: ^3.10.0
resolution: workspace
dependencies:
  crypto: ^3.0.6
  hooks: ^2.0.0
  prismarine_shaders:
    path: ../prismarine_shaders
  yaml: ^3.1.0
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
