name: prismarine_pad
description: The host's game pads for the mcsm player, read through SDL3's gamepad subsystem (a Rust crate the package's build hook builds, SDL built from source and linked in), in the standard Xbox layout.
publish_to: none
environment:
  sdk: ^3.10.0
resolution: workspace
dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  prismarine_cargo:
    path: ../prismarine_cargo
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
