name: prismarine_pbr
description: A forward renderer of glTF scenes with metallic-roughness materials, a sun with a shadow map, point lights and a tone map. It builds frame plans that prismarine_render records.
publish_to: none
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  prismarine_frame:
    path: ../prismarine_frame
  prismarine_math:
    path: ../prismarine_math
  prismarine_render:
    path: ../prismarine_render
  prismarine_scene:
    path: ../prismarine_scene
  vector_math: ^2.1.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  prismarine_assets:
    path: ../prismarine_assets
  prismarine_shaders:
    path: ../prismarine_shaders
dependency_overrides:
  # Flutter GPU with the patches of the engine fork.
  flutter_gpu:
    path: ../../third_party/flutter_gpu
