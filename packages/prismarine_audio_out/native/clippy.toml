# The platform's C maths differ between targets (macOS arm64/x86_64, glibc,
# the MSVC CRT): decoding uses the libm crate's. sqrt, floor, ceil, round,
# abs and the like are exact everywhere and stay allowed.
disallowed-methods = [
  { path = "f64::sin", reason = "platform libm: use libm::sin" },
  { path = "f64::cos", reason = "platform libm: use libm::cos" },
  { path = "f64::tan", reason = "platform libm: use the libm crate" },
  { path = "f64::sin_cos", reason = "platform libm: use libm::sin and libm::cos" },
  { path = "f64::exp", reason = "platform libm: use libm::exp" },
  { path = "f64::exp2", reason = "platform libm: use the libm crate" },
  { path = "f64::exp_m1", reason = "platform libm: use the libm crate" },
  { path = "f64::ln", reason = "platform libm: use libm::log" },
  { path = "f64::log", reason = "platform libm: use libm::log" },
  { path = "f64::log2", reason = "platform libm: use the libm crate" },
  { path = "f64::log10", reason = "platform libm: use the libm crate" },
  { path = "f64::ln_1p", reason = "platform libm: use the libm crate" },
  { path = "f64::powf", reason = "platform libm: use libm::pow" },
  { path = "f64::powi", reason = "platform libm: use libm::pow" },
  { path = "f64::atan", reason = "platform libm: use the libm crate" },
  { path = "f64::atan2", reason = "platform libm: use the libm crate" },
  { path = "f64::asin", reason = "platform libm: use the libm crate" },
  { path = "f64::acos", reason = "platform libm: use the libm crate" },
  { path = "f64::hypot", reason = "platform libm: use the libm crate" },
  { path = "f64::cbrt", reason = "platform libm: use the libm crate" },
  { path = "f64::mul_add", reason = "a fused multiply-add: each multiply and add must round on its own" },
  { path = "f32::sin", reason = "platform libm" },
  { path = "f32::cos", reason = "platform libm" },
  { path = "f32::exp", reason = "platform libm" },
  { path = "f32::ln", reason = "platform libm" },
  { path = "f32::powf", reason = "platform libm" },
  { path = "f32::mul_add", reason = "a fused multiply-add: each multiply and add must round on its own" },
]
