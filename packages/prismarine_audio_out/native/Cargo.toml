[package]
name = "prismarine_audio_out"
version = "0.1.0"
edition = "2021"
publish = false
description = "The native library of prismarine_audio_out. MP3 and Ogg Vorbis decoders, a process-wide cache of decoded audio, streams, the output device, a PCM ring into it and the native render of the audio engine."

[lib]
name = "prismarine_audio_out"
crate-type = ["cdylib", "rlib"]

[dependencies]
# A bounded lock-free queue that does not allocate after creation, for the
# commands of the audio engine from any isolate and the records of its
# render thread.
crossbeam-queue = "0.3"
# Shared and owned pointers whose last drop on the render thread goes to a
# collector in place of a free there.
basedrop = "0.1"
# Debug builds check that the render of the audio engine does not allocate.
assert_no_alloc = "1.1"
# CachePadded: each writer's atomics on their own cache line (128 B on Apple Silicon).
crossbeam-utils = "0.8"
# PCM rendered elsewhere into the output device (push.rs) and the audio
# tap of the engine, through a wait-free single-producer single-consumer
# ring.
rtrb = "0.3"
# The output device on every desktop platform (CoreAudio, WASAPI, ALSA).
cpal = "0.18"
# sin, cos, exp, log and pow in portable Rust (musl's fdlibm code) for
# stb_vorbis's tables and the engine's maths (mix/dmath.rs): the same bits on
# every target, where the platform's C maths differ. Pinned, so that the
# decoded and rendered bits stay the same. prismarine_math's lib/libm.dart
# follows this version bit for bit.
libm = { version = "=0.2.16", default-features = false }

# The decode threads' roles (decode/os.rs): the nice and RLIMIT_NICE calls
# on Linux, the priority and power throttling calls on Windows.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Linux: the device's thread at real-time priority, as CoreAudio's and
# WASAPI's are.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["realtime"] }

[build-dependencies]
cc = "1"

[profile.release]
# No strip pass, here and for host-side proc-macros:
# Xcode 27's strip leaves dylibs dyld refuses ("mis-aligned LINKEDIT string
# pool"). In the manifest, so no build environment can lose it.
strip = "none"
opt-level = 3
codegen-units = 1
debug = false

[profile.release.build-override]
strip = "none"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
# clippy.toml: no platform maths (sin, exp, powf, …) and no mul_add.
disallowed_methods = "deny"
