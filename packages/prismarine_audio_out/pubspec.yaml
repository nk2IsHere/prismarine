name: prismarine_audio_out
description: Audio output on the desktop. MP3 and Ogg Vorbis decoders, a process-wide cache of decoded audio, streams, a PCM ring into the output device and an isolate that renders into it. The build hook builds a Rust crate with the decoders compiled in.
publish_to: none
environment:
  sdk: ^3.10.0
resolution: workspace
dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  prismarine_audio:
    path: ../prismarine_audio
  prismarine_cargo:
    path: ../prismarine_cargo
dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
